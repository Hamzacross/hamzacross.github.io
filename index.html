```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>YouTube Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 64px;
            min-height: 64px;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
        }

        .logo {
            color: white;
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .input {
            flex: 1;
            height: 42px;
            border: 1px solid #333;
            border-radius: 22px;
            background: #181818;
            color: white;
            padding: 0 18px;
            outline: none;
            font-size: 15px;
        }

        .input:focus {
            border-color: #777;
        }

        .button {
            height: 42px;
            border: 0;
            border-radius: 21px;
            background: #ff0000;
            color: white;
            padding: 0 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .button:hover {
            background: #cc0000;
        }

        .player {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .message {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #aaa;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .topbar {
                height: 58px;
                min-height: 58px;
                padding: 8px;
            }

            .logo {
                display: none;
            }

            .input {
                font-size: 14px;
            }

            .button {
                padding: 0 15px;
            }
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="logo">YouTube</div>

        <input
            id="youtubeInput"
            class="input"
            type="text"
            placeholder="Paste a YouTube URL or video ID..."
            autocomplete="off"
        >

        <button class="button" onclick="loadVideo()">
            Watch
        </button>
    </div>

    <main class="player">
        <div id="message" class="message">
            Paste a YouTube video URL above.
        </div>

        <iframe
            id="youtubeFrame"
            title="YouTube Player"
            allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share;
                fullscreen
            "
            allowfullscreen
        ></iframe>
    </main>

    <script>
        const input = document.getElementById("youtubeInput");
        const iframe = document.getElementById("youtubeFrame");
        const message = document.getElementById("message");

        function getVideoId(value) {
            value = value.trim();

            // Direct YouTube video ID
            if (/^[a-zA-Z0-9_-]{11}$/.test(value)) {
                return value;
            }

            try {
                const url = new URL(value);

                // youtube.com/watch?v=VIDEO_ID
                if (
                    url.hostname === "youtube.com" ||
                    url.hostname === "www.youtube.com" ||
                    url.hostname === "m.youtube.com"
                ) {
                    const id = url.searchParams.get("v");

                    if (id) {
                        return id;
                    }

                    // youtube.com/embed/VIDEO_ID
                    const embedMatch =
                        url.pathname.match(/^\/embed\/([a-zA-Z0-9_-]{11})/);

                    if (embedMatch) {
                        return embedMatch[1];
                    }

                    // youtube.com/shorts/VIDEO_ID
                    const shortsMatch =
                        url.pathname.match(/^\/shorts\/([a-zA-Z0-9_-]{11})/);

                    if (shortsMatch) {
                        return shortsMatch[1];
                    }
                }

                // youtu.be/VIDEO_ID
                if (url.hostname === "youtu.be") {
                    const id = url.pathname.substring(1);

                    if (/^[a-zA-Z0-9_-]{11}$/.test(id)) {
                        return id;
                    }
                }

            } catch {
                return null;
            }

            return null;
        }

        function loadVideo() {
            const value = input.value;
            const videoId = getVideoId(value);

            if (!videoId) {
                message.textContent =
                    "Invalid YouTube URL or video ID.";
                message.style.display = "flex";
                iframe.src = "";
                return;
            }

            iframe.src =
                "https://www.youtube.com/embed/" +
                videoId +
                "?autoplay=1&rel=0";

            message.style.display = "none";
        }

        input.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                loadVideo();
            }
        });
    </script>

</body>
</html>

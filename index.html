```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hamza Web Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0d;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 22px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            margin: 7px 0 0;
            color: #888;
            font-size: 14px;
        }

        .apps {
            width: min(700px, calc(100% - 30px));
            margin: 10px auto 30px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .app {
            border: 1px solid #242428;
            background: #151519;
            color: white;

            border-radius: 14px;
            padding: 18px;

            cursor: pointer;
            text-align: left;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .app:hover {
            transform: translateY(-2px);
            background: #1b1b20;
            border-color: #3a3a42;
        }

        .app-title {
            font-size: 17px;
            font-weight: 700;
        }

        .app-description {
            margin-top: 6px;
            color: #888;
            font-size: 13px;
        }

        .viewer {
            width: min(1100px, calc(100% - 30px));
            height: 650px;
            margin: 0 auto 30px;

            display: none;
            position: relative;

            background: #000;
            border: 1px solid #242428;
            border-radius: 16px;
            overflow: hidden;
        }

        .viewer.active {
            display: block;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
        }

        .viewer-bar {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;

            display: flex;
            gap: 8px;
        }

        .viewer-button {
            border: 1px solid #444;
            background: rgba(15, 15, 15, 0.9);
            color: white;

            border-radius: 9px;
            padding: 8px 12px;

            cursor: pointer;
        }

        .viewer-button:hover {
            background: #222;
        }

        .notice {
            width: min(700px, calc(100% - 30px));
            margin: 0 auto 30px;

            color: #777;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 600px) {
            .apps {
                grid-template-columns: 1fr;
            }

            .viewer {
                height: 70vh;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Hamza Web Hub</h1>
    <p>Open supported websites and services in one place.</p>
</header>

<section class="apps">

    <button class="app" onclick="openYouTube()">
        <div class="app-title">YouTube</div>
        <div class="app-description">
            YouTube video player
        </div>
    </button>

    <button class="app" onclick="openSpotify()">
        <div class="app-title">Spotify</div>
        <div class="app-description">
            Spotify embed player
        </div>
    </button>

    <button class="app" onclick="openWebsite('https://discord.com/app')">
        <div class="app-title">Discord</div>
        <div class="app-description">
            Try opening Discord
        </div>
    </button>

    <button class="app" onclick="openWebsite('https://www.snapchat.com/')">
        <div class="app-title">Snapchat</div>
        <div class="app-description">
            Try opening Snapchat
        </div>
    </button>

    <button class="app" onclick="openTikTok()">
        <div class="app-title">TikTok</div>
        <div class="app-description">
            TikTok embed player
        </div>
    </button>

    <button class="app" onclick="openWebsite('https://www.google.com/')">
        <div class="app-title">Test Website</div>
        <div class="app-description">
            Test normal iframe compatibility
        </div>
    </button>

</section>

<div id="viewer" class="viewer">

    <div class="viewer-bar">
        <button
            class="viewer-button"
            onclick="openCurrentInNewTab()"
        >
            ↗ Open
        </button>

        <button
            class="viewer-button"
            onclick="closeViewer()"
        >
            ✕ Close
        </button>
    </div>

    <iframe
        id="frame"
        allow="
            autoplay;
            clipboard-write;
            encrypted-media;
            fullscreen;
            picture-in-picture;
            web-share
        "
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

</div>

<div class="notice">
    Some websites intentionally block being displayed inside an iframe.
    If a site does not load, use the Open button instead.
</div>

<script>
    const viewer = document.getElementById("viewer");
    const frame = document.getElementById("frame");

    let currentURL = "";

    function show(url) {
        currentURL = url;

        frame.src = url;
        viewer.classList.add("active");

        viewer.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }

    function closeViewer() {
        frame.src = "";
        viewer.classList.remove("active");
        currentURL = "";
    }

    function openCurrentInNewTab() {
        if (!currentURL) return;

        window.open(
            currentURL,
            "_blank",
            "noopener,noreferrer"
        );
    }

    function openWebsite(url) {
        show(url);
    }

    function openYouTube() {
        const id = prompt(
            "Enter a YouTube video ID or YouTube URL:"
        );

        if (!id) return;

        let videoID = id.trim();

        /*
            Supports:

            https://youtube.com/watch?v=VIDEO_ID
            https://www.youtube.com/watch?v=VIDEO_ID
            https://youtu.be/VIDEO_ID
            https://youtube.com/shorts/VIDEO_ID
            VIDEO_ID
        */

        if (videoID.includes("youtube.com/watch")) {
            try {
                videoID =
                    new URL(videoID)
                    .searchParams
                    .get("v");
            } catch {
                videoID = "";
            }
        }

        else if (videoID.includes("youtu.be/")) {
            videoID =
                videoID
                .split("youtu.be/")[1]
                .split(/[?&]/)[0];
        }

        else if (videoID.includes("youtube.com/shorts/")) {
            videoID =
                videoID
                .split("youtube.com/shorts/")[1]
                .split(/[?&]/)[0];
        }

        if (!videoID) {
            alert("Invalid YouTube URL.");
            return;
        }

        show(
            "https://www.youtube.com/embed/" +
            videoID +
            "?rel=0"
        );
    }

    function openSpotify() {

        /*
            Spotify officially supports iframe embeds.

            This example opens a Spotify playlist.
            Replace the ID with your own playlist/track/album/etc.
        */

        show(
            "https://open.spotify.com/embed/playlist/" +
            "37i9dQZF1DXcBWIGoYBM5N"
        );
    }

    function openTikTok() {

        /*
            TikTok's official iframe player requires
            a TikTok POST ID.

            Example video ID:
            6718335390845095173
        */

        const id = prompt(
            "Enter the TikTok video ID:"
        );

        if (!id) return;

        if (!/^\d+$/.test(id.trim())) {
            alert("Invalid TikTok video ID.");
            return;
        }

        show(
            "https://www.tiktok.com/player/v1/" +
            id.trim() +
            "?controls=1&description=1&music_info=1"
        );
    }
</script>

</body>
</html>
